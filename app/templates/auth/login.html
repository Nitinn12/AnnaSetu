{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
{% from "partials/icons.html" import icon %}
{% set fv = form_values or {} %}

<section class="auth-shell">
  <div class="container">
    <div class="row g-4 align-items-center justify-content-center">
      <div class="d-none d-md-block col-md-5 col-lg-6">
        <div class="auth-art">
          <img class="auth-art__img logo-full" src="{{ url_for('static', filename='img/AnnaSetu-transparent.png') }}" alt="AnnaSetu logo" width="792" height="347">
          <p class="auth-art__wordmark">AnnaSetu</p>
        </div>
      </div>

      <div class="col-12 col-md-7 col-lg-5">
        <div class="auth-card">
          <h2 class="h3 fw-bold">Welcome back</h2>
          <p class="form-hint">Log in to continue to your AnnaSetu dashboard.</p>

          <form method="post" action="{{ url_for('auth.login') }}" class="mt-3">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

            <div class="form-field">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" name="email" required autocomplete="email" value="{{ fv.email or '' }}">
            </div>

            <div class="form-field">
              <label for="password" class="form-label">Password</label>
              <div class="password-field">
                <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                <button type="button" class="password-toggle" data-target="password" aria-label="Show password" aria-pressed="false">Show</button>
              </div>
            </div>

            <button type="submit" class="btn-brand w-100">Log in</button>
          </form>

          <p class="form-hint mt-4 mb-0">
            New here? <a href="{{ url_for('auth.register') }}">Create an account</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}

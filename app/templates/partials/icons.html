{% macro icon(name, label=none) -%}
<svg class="icon icon-{{ name }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"{% if label is none %} aria-hidden="true" focusable="false"{% else %} role="img" aria-label="{{ label }}"{% endif %}>
{%- if name == "donate" %}
  <path d="M4 12h16a8 8 0 0 1-16 0z"/>
  <path d="M12 9V2"/>
  <path d="M9 5l3-3 3 3"/>
{%- elif name == "find" %}
  <path d="M9 4L3 6.5v13L9 17l6 2.5 6-2.5v-13L15 6.5z"/>
  <path d="M9 4v13M15 6.5v13"/>
{%- elif name == "volunteer" %}
  <circle cx="9" cy="8" r="3.5"/>
  <path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/>
  <path d="M19 9.5c-1.5-1.8-4-1-4 1 0 2 4 4.2 4 4.2s4-2.2 4-4.2c0-2-2.5-2.8-4-1z"/>
{%- elif name == "clock" %}
  <circle cx="12" cy="12" r="9"/>
  <path d="M12 7v5l3 2"/>
{%- elif name == "leaf" %}
  <path d="M5 19C5 10 10 5 20 4c0 10-5 15-15 15z"/>
  <path d="M5 19L13 11"/>
{%- elif name == "shield" %}
  <path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/>
  <path d="M9 12l2 2 4-4"/>
{%- elif name == "thermometer" %}
  <path d="M10 14.5V5a2 2 0 0 1 4 0v9.5a4 4 0 1 1-4 0z"/>
  <path d="M12 10v6"/>
{%- elif name == "allergen" %}
  <path d="M12 3.5L21.5 20h-19z"/>
  <path d="M12 10v3.5"/>
  <circle cx="12" cy="16.5" r="1.1" fill="currentColor" stroke="none"/>
{%- elif name == "check" %}
  <path d="M5 12.5l4.5 4.5L19 7.5"/>
{%- elif name == "arrow" %}
  <path d="M5 12h14"/>
  <path d="M13 6l6 6-6 6"/>
{%- elif name == "logout" %}
  <path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/>
  <path d="M10 8l-4 4 4 4"/>
  <path d="M6 12h10"/>
{%- elif name == "dashboard" %}
  <rect x="3" y="3" width="7.5" height="7.5" rx="2"/>
  <rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/>
  <rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/>
  <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>
{%- elif name == "package" %}
  <path d="M21 8l-9-5-9 5v8l9 5 9-5z"/>
  <path d="M3 8l9 5 9-5"/>
  <path d="M12 13v8"/>
{%- elif name == "truck" %}
  <path d="M2 6h12v10H2z"/>
  <path d="M14 10h4l4 4v2h-8"/>
  <circle cx="6.5" cy="17.5" r="1.8"/>
  <circle cx="17.5" cy="17.5" r="1.8"/>
{%- elif name == "user" %}
  <circle cx="12" cy="8" r="4"/>
  <path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>
{%- elif name == "mail" %}
  <rect x="3" y="5" width="18" height="14" rx="2"/>
  <path d="M3.5 6.5L12 13l8.5-6.5"/>
{%- elif name == "lock" %}
  <rect x="5" y="11" width="14" height="10" rx="2"/>
  <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
{%- elif name == "eye" %}
  <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/>
  <circle cx="12" cy="12" r="3"/>
{%- elif name == "info" %}
  <circle cx="12" cy="12" r="9"/>
  <path d="M12 11v5"/>
  <circle cx="12" cy="8" r="0.6" fill="currentColor"/>
{%- elif name == "alert" %}
  <path d="M10.3 4.2L2.7 17.5a2 2 0 0 0 1.7 3h15.2a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0z"/>
  <path d="M12 9.5v4"/>
  <circle cx="12" cy="17" r="0.6" fill="currentColor"/>
{%- elif name == "calendar" %}
  <rect x="3" y="4.5" width="18" height="16.5" rx="2"/>
  <path d="M3 9.5h18M8 3v3M16 3v3"/>
{%- elif name == "pin" %}
  <path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/>
  <circle cx="12" cy="10" r="2.2"/>
{%- elif name == "heart" %}
  <path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/>
{%- elif name == "plate" %}
  <circle cx="12" cy="12" r="9"/>
  <circle cx="12" cy="12" r="4.5"/>
{%- elif name == "help" %}
  <circle cx="12" cy="12" r="9"/>
  <path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7v.5"/>
  <circle cx="12" cy="17" r="0.6" fill="currentColor"/>
{%- else %}
  <circle cx="12" cy="12" r="9"/>
{%- endif %}
</svg>
{%- endmacro %}

{% extends "base.html" %}
{% block title %}Something went wrong{% endblock %}
{% block content %}

<section class="page-hero">
  <div class="container text-center">
    <p class="text-muted-soft small fw-semibold text-uppercase mb-2">Error 500</p>
    <h1 class="h2 fw-bold">Something went wrong on our side.</h1>
    <p class="text-muted mx-auto mb-0" style="max-width: 36rem;">We have logged the problem. Please try again in a moment.</p>
  </div>
</section>

<div class="container py-4">
  <div class="page-cta d-flex flex-column flex-sm-row justify-content-center gap-2">
    <a class="btn-brand" href="{{ url_for('main.index') }}">Back to home</a>
    <a class="btn-brand-outline" href="{{ url_for('main.food_safety') }}">Food safety guidelines</a>
  </div>
</div>

{% endblock %}

{% extends "base.html" %}
{% block title %}404 Not found{% endblock %}
{% block content %}

<section class="page-hero">
  <div class="container text-center">
    <p class="text-muted-soft small fw-semibold text-uppercase mb-2">Error 404</p>
    <h1 class="h2 fw-bold">We could not find that page.</h1>
    <p class="text-muted mx-auto mb-0" style="max-width: 36rem;">The link may be out of date or the page may have moved. Head back home or check the food safety guidelines.</p>
  </div>
</section>

<div class="container py-4">
  <div class="page-cta d-flex flex-column flex-sm-row justify-content-center gap-2">
    <a class="btn-brand" href="{{ url_for('main.index') }}">Back to home</a>
    <a class="btn-brand-outline" href="{{ url_for('main.food_safety') }}">Food safety guidelines</a>
  </div>
</div>

{% endblock %}
